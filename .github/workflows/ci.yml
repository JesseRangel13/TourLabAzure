name: Azure companion
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      accept_sql_developer_eula:
        description: Accept SQL Developer license for disposable local CI only
        type: boolean
        required: true
        default: false
      accept_servicebus_eula:
        description: Accept Service Bus emulator license for disposable local CI only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: azure-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: { global-json-file: global.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web/tours-angular/.nvmrc
          cache: npm
          cache-dependency-path: web/tours-angular/package-lock.json
      - name: Fresh restricted configuration; no cloud credentials
        run: ./scripts/New-LocalConfiguration.ps1
      - name: Locked build, actual unit tests, audit and production SPA
        run: ./scripts/Verify-Foundation.ps1
      - name: Build five separate application images; never publish
        shell: bash
        run: |
          set -euo pipefail
          for service in Gateway Catalog Reservations Payments Notifications; do
            docker build --build-arg SERVICE="$service" -t "tourlab-azure-${service,,}:ci" .
          done
      - name: Package the isolated Functions application; never deploy
        run: |
          dotnet publish src/Receipts.Functions -c Release --no-restore -o .local/packages/receipts
          if ($LASTEXITCODE -ne 0) { throw 'Functions packaging failed' }
  full-stack:
    needs: foundation
    if: github.event_name == 'workflow_dispatch' && inputs.accept_sql_developer_eula && inputs.accept_servicebus_eula
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: tourlab-azure-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run: { shell: pwsh }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with: { global-json-file: global.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: web/tours-angular/.nvmrc
          cache: npm
          cache-dependency-path: web/tours-angular/package-lock.json
      - name: Fresh build and synthetic private credentials
        run: |
          ./scripts/New-LocalConfiguration.ps1
          ./scripts/Verify-Foundation.ps1
      - name: Trust only this run's generated CA in OS and Chromium NSS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnss3-tools unzip
          sudo install -m 644 .local/certificates/ca.crt /usr/local/share/ca-certificates/tourlab-azure-ci.crt
          sudo update-ca-certificates
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -N --empty-password -d "sql:$HOME/.pki/nssdb"
          fi
          certutil -A -d "sql:$HOME/.pki/nssdb" -n tourlab-azure-ci -t 'C,,' -i .local/certificates/ca.crt
      - name: Install pinned Chromium and its Linux dependencies
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Browser locked install failed' }
          $env:PLAYWRIGHT_BROWSERS_PATH=Join-Path $env:GITHUB_WORKSPACE '.local/playwright'
          npx --no-install playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw 'Pinned browser installation failed' }
      - name: Start actual isolated SQL, Service Bus, Blob and Cosmos emulators
        run: |
          ./scripts/Start-Sql.ps1 -AcceptSqlDeveloperLicense
          ./scripts/Start-Broker.ps1 -AcceptSqlDeveloperLicense -AcceptServiceBusLicense
          ./scripts/Start-Images.ps1
          ./scripts/Start-Cosmos.ps1
          ./scripts/Wait-Dependencies.ps1 -SkipBroker
      - name: Actual relational, broker and storage regression; no skipped tests
        run: ./scripts/Verify-Integration.ps1 -Profile Docker -IsolatedBroker -AcceptSqlDeveloperLicense -AcceptServiceBusLicense
      - name: Actual Angular, five APIs, durable workers and Functions trigger in Chromium
        run: ./scripts/Verify-FullStack.ps1 -Profile Docker -IsolatedBroker -AcceptSqlDeveloperLicense -AcceptServiceBusLicense
      - name: Export count-only summary; raw authenticated evidence stays private
        if: always()
        run: ./scripts/Write-TestSummary.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tourlab-azure-counts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-summary.json
          include-hidden-files: true # Only the exact count-only file above; never the private directory.
          if-no-files-found: error
          retention-days: 3
      - name: Stop only this run's containers; retain volumes
        if: always()
        run: |
          $root=(Get-Location).Path
          . ./scripts/Test-BrokerProfile.ps1
          foreach ($folder in Get-ChildItem .local/isolatedbroker-* -Directory -ErrorAction SilentlyContinue) {
            $run=$folder.Name.Replace('isolatedbroker-','')
            if ($run -notmatch '^[a-f0-9]{32}$') { throw 'Invalid owned test run directory' }
            Stop-IsolatedTestBroker @{Project="tourlab-azure-az010-$run";File=(Join-Path $folder.FullName 'credentials.env')}
          }
          if (Test-Path .local/dependencies.env) {
            docker compose --env-file .local/dependencies.env stop
            if ($LASTEXITCODE -ne 0) { throw 'Owned container stop failed' }
          }
      # No secrets, auth state, traces, screenshots, raw logs or reports are uploaded.
      # No Azure login, paid resources, cloud role assignment, publish or deployment.
